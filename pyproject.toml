[project]
name = "tara"
version = "0.0.1"
description = "Context-aware AI meeting participant (Phase 1: deterministic core)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff", "mypy"]
live = ["google-genai>=2"]   # Gemini Live SDK (an API client, not a model download)
audio = ["sounddevice>=0.5"] # local mic/speaker demo; optional, no model download

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "offline: no network, no models (default)",
  "live_api: real Gemini Live API call; opt-in only (TARA_LIVE_TEST=1 plus key and model id)",
  "external: real public HTTP provider check; opt-in only (TARA_EXTERNAL_TESTS=1)",
]
addopts = "-m 'not live_api and not external'"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["E701", "E702", "UP042"]   # one-line guards are deliberate; str+Enum kept so values stay plain strings in JSON/logs

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E741", "E731"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
