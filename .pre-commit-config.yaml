# Local hooks only: they use the ruff and mypy already in .venv, so nothing is fetched from the network.
# Install with `make hooks`.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: .venv/bin/ruff check --force-exclude
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy src
        language: system
        types: [python]
        pass_filenames: false
